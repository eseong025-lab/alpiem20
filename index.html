<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoC 7th TRPG 핸드아웃 생성기</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      color: #2c3e50;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      max-width: 1140px;
      width: 100%;
    }

    /* 좌측 에디터 패널 (화이트 스타일) */
    .editor-panel {
      flex: 1;
      min-width: 340px;
      background-color: #ffffff;
      padding: 28px;
      border-radius: 12px;
      border: 1px solid #e1e8ed;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      max-height: 88vh;
      overflow-y: auto;
    }

    /* 스크롤바 스타일링 */
    .editor-panel::-webkit-scrollbar {
      width: 6px;
    }
    .editor-panel::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 3px;
    }

    .editor-panel h2 {
      margin-top: 0;
      color: #1e293b;
      font-size: 1.35rem;
      font-weight: 700;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #475569;
      margin-top: 22px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px dashed #cbd5e1;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.88rem;
      color: #334155;
    }

    .form-group input[type="text"],
    .form-group select,
    .form-group textarea,
    .form-group input[type="number"],
    .form-group input[type="color"] {
      width: 100%;
      padding: 9px 12px;
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      color: #0f172a;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .form-group input[type="text"]:focus,
    .form-group select:focus,
    .form-group textarea:focus,
    .form-group input[type="number"]:focus {
      outline: none;
      background-color: #ffffff;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .form-group input[type="color"] {
      height: 38px;
      cursor: pointer;
      padding: 2px;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    /* 툴바 버튼 스타일 */
    .style-toolbar {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .tool-btn {
      padding: 7px 12px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: all 0.15s ease;
    }

    .tool-btn:hover {
      background-color: #e2e8f0;
      color: #0f172a;
    }

    .tool-btn.active {
      background-color: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }

    /* 커스텀 업로드 버튼 */
    .file-input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
      margin-bottom: 8px;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .file-custom-btn {
      display: block;
      width: 100%;
      text-align: center;
      padding: 10px;
      background-color: #f8fafc;
      color: #475569;
      border: 1px dashed #94a3b8;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .file-custom-btn:hover {
      background-color: #f1f5f9;
      color: #1e293b;
      border-color: #64748b;
    }

    /* 다운로드 버튼 */
    .btn-download {
      width: 100%;
      padding: 14px;
      background-color: #1e293b;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 4px 12px rgba(30, 41, 59, 0.15);
      transition: all 0.2s ease;
    }

    .btn-download:hover {
      background-color: #0f172a;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(30, 41, 59, 0.25);
    }

    /* 우측 미리보기 패널 */
    .preview-panel {
      flex: 1;
      min-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .preview-panel h3 {
      margin-top: 0;
      align-self: flex-start;
      color: #64748b;
      font-size: 1.05rem;
      font-weight: 600;
    }

    /* 작업대 느낌의 미리보기 프레임 */
    .preview-stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      background-color: #e2e8f0;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      min-height: 600px;
    }

    /* 핸드아웃 카드 공통 스타일 */
    .handout-card {
      width: 420px;
      min-height: 550px;
      padding: 55px 45px;
      box-sizing: border-box;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
      word-break: break-all;
      white-space: pre-wrap;
      position: relative;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      background-color: transparent;
    }

    .handout-title {
      margin: 0;
      text-align: center;
      font-size: 1.5rem;
      transition: all 0.1s;
    }

    .handout-divider {
      border: none;
      height: 1px;
      background-color: rgba(60, 40, 20, 0.4);
      margin: 15px 0;
    }

    .handout-content {
      font-size: 1rem;
      line-height: 1.8;
      margin: 0;
      transition: all 0.1s;
    }

    /* --- 이미지 기반 테마 --- */
    .handout-card.theme-img1 {
      background-image: url('pngwing.com.png');
      color: #2b1d0c;
      font-family: 'Nanum Myeongjo', serif;
    }

    .handout-card.theme-img2 {
      background-image: url('pngwing.com (1).png');
      color: #3d2b1f;
      font-family: 'Nanum Myeongjo', serif;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="editor-panel">
      <h2>📜 CoC 핸드아웃 메이커</h2>

      <div class="form-group">
        <label for="theme-select">종이 질감 디자인 선택</label>
        <select id="theme-select">
          <option value="theme-img1">📜 테마 1: 낡은 양치피지 (pngwing.com)</option>
          <option value="theme-img2">📜 테마 2: 번진 클래식 종이 (pngwing.com (1))</option>
        </select>
      </div>

      <div class="section-title">📁 커스텀 리소스</div>
      <div class="form-group">
        <div class="file-input-wrapper">
          <label for="bg-file" class="file-custom-btn" id="bg-file-label">🖼️ 다른 배경 이미지 직접 업로드</label>
          <input type="file" id="bg-file" accept="image/*">
        </div>
        <div class="file-input-wrapper">
          <label for="font-file" class="file-custom-btn" id="font-file-label">🔤 TTF / OTF 폰트 파일 업로드</label>
          <input type="file" id="font-file" accept=".ttf,.otf,.woff,.woff2">
        </div>
      </div>

      <div class="section-title">✍️ 내용 작성</div>
      <div class="form-group">
        <label for="input-title">제목</label>
        <input type="text" id="input-title" value="미스카토닉 대학 도서관 기록">
      </div>

      <div class="form-group">
        <label for="input-content">본문 내용</label>
        <textarea id="input-content" rows="6">1920년 8월 14일...
금서 구역 깊은 곳에서 발견된 봉인된 일기장.

페이지 곳곳에 알 수 없는 얼룩과 핏자국이 남아있다.

"그 이름을 입에 담지 말라. 별들이 제자리를 찾을 때, 그것이 다시 일어날지니..."</textarea>
      </div>

      <div class="section-title">🎨 제목 서식</div>
      <div class="form-row">
        <div class="form-group">
          <label>크기 (px)</label>
          <input type="number" id="title-size" value="22" min="10" max="72">
        </div>
        <div class="form-group">
          <label>색상</label>
          <input type="color" id="title-color" value="#2b1d0c">
        </div>
      </div>
      <div class="style-toolbar">
        <button type="button" class="tool-btn" id="title-btn-bold"><b>B</b></button>
        <button type="button" class="tool-btn" id="title-btn-italic"><i>I</i></button>
        <button type="button" class="tool-btn" id="title-align-left">좌측</button>
        <button type="button" class="tool-btn active" id="title-align-center">중앙</button>
        <button type="button" class="tool-btn" id="title-align-right">우측</button>
      </div>

      <div class="section-title">📝 본문 서식</div>
      <div class="form-row">
        <div class="form-group">
          <label>크기 (px)</label>
          <input type="number" id="content-size" value="15" min="10" max="48">
        </div>
        <div class="form-group">
          <label>줄간격 (em)</label>
          <input type="number" id="content-lineheight" value="1.7" step="0.1" min="1" max="3">
        </div>
        <div class="form-group">
          <label>색상</label>
          <input type="color" id="content-color" value="#2b1d0c">
        </div>
      </div>
      <div class="style-toolbar">
        <button type="button" class="tool-btn" id="content-btn-bold"><b>B</b></button>
        <button type="button" class="tool-btn" id="content-btn-italic"><i>I</i></button>
        <button type="button" class="tool-btn active" id="content-align-left">좌측</button>
        <button type="button" class="tool-btn" id="content-align-center">중앙</button>
        <button type="button" class="tool-btn" id="content-align-right">우측</button>
        <button type="button" class="tool-btn" id="content-align-justify">양쪽</button>
      </div>

      <button class="btn-download" id="btn-download">💾 PNG 이미지 저장하기</button>
    </div>

    <div class="preview-panel">
      <h3>미리보기</h3>
      <div class="preview-stage">
        <div id="handout-card" class="handout-card theme-img1">
          <h2 id="handout-title" class="handout-title">미스카토닉 대학 도서관 기록</h2>
          <hr class="handout-divider">
          <p id="handout-content" class="handout-content"></p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // DOM 요소
    const themeSelect = document.getElementById('theme-select');
    const bgFileInput = document.getElementById('bg-file');
    const bgFileLabel = document.getElementById('bg-file-label');
    const fontFileInput = document.getElementById('font-file');
    const fontFileLabel = document.getElementById('font-file-label');

    const inputTitle = document.getElementById('input-title');
    const inputContent = document.getElementById('input-content');

    const handoutCard = document.getElementById('handout-card');
    const handoutTitle = document.getElementById('handout-title');
    const handoutContent = document.getElementById('handout-content');
    const btnDownload = document.getElementById('btn-download');

    // 서식 컨트롤
    const titleSize = document.getElementById('title-size');
    const titleColor = document.getElementById('title-color');
    const titleBtnBold = document.getElementById('title-btn-bold');
    const titleBtnItalic = document.getElementById('title-btn-italic');

    const contentSize = document.getElementById('content-size');
    const contentLineHeight = document.getElementById('content-lineheight');
    const contentColor = document.getElementById('content-color');
    const contentBtnBold = document.getElementById('content-btn-bold');
    const contentBtnItalic = document.getElementById('content-btn-italic');

    // 상태 변수
    let customFontFace = null;
    let customBgUrl = null;

    let isTitleBold = false;
    let isTitleItalic = false;
    let titleAlign = 'center';

    let isContentBold = false;
    let isContentItalic = false;
    let contentAlign = 'left';

    // 커스텀 배경 이미지 파일 로드
    bgFileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        customBgUrl = evt.target.result;
        handoutCard.style.backgroundImage = `url('${customBgUrl}')`;
        bgFileLabel.textContent = `✅ 적용 완료: ${file.name}`;
        bgFileLabel.style.backgroundColor = '#e2e8f0';
        bgFileLabel.style.borderColor = '#3b82f6';
      };
      reader.readAsDataURL(file);
    });

    // 커스텀 폰트 파일 로드
    fontFileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const fontData = evt.target.result;
        const fontName = 'CustomFont_' + Date.now();
        
        const newFont = new FontFace(fontName, fontData);
        newFont.load().then(function(loadedFont) {
          document.fonts.add(loadedFont);
          customFontFace = fontName;
          handoutCard.style.fontFamily = `"${fontName}", serif`;
          fontFileLabel.textContent = `✅ 적용 완료: ${file.name}`;
          fontFileLabel.style.backgroundColor = '#e2e8f0';
          fontFileLabel.style.borderColor = '#3b82f6';
        }).catch(function(err) {
          alert('폰트 로드 실패');
          console.error(err);
        });
      };
      reader.readAsArrayBuffer(file);
    });

    // 스타일 전체 업데이트
    function updateStyles() {
      handoutTitle.textContent = inputTitle.value;
      handoutTitle.style.fontSize = `${titleSize.value}px`;
      handoutTitle.style.color = titleColor.value;
      handoutTitle.style.fontWeight = isTitleBold ? 'bold' : 'normal';
      handoutTitle.style.fontStyle = isTitleItalic ? 'italic' : 'normal';
      handoutTitle.style.textAlign = titleAlign;

      handoutContent.textContent = inputContent.value;
      handoutContent.style.fontSize = `${contentSize.value}px`;
      handoutContent.style.lineHeight = contentLineHeight.value;
      handoutContent.style.color = contentColor.value;
      handoutContent.style.fontWeight = isContentBold ? 'bold' : 'normal';
      handoutContent.style.fontStyle = isContentItalic ? 'italic' : 'normal';
      handoutContent.style.textAlign = contentAlign;

      if (!customBgUrl) {
        handoutCard.className = `handout-card ${themeSelect.value}`;
        handoutCard.style.backgroundImage = '';
      }

      if (customFontFace) {
        handoutCard.style.fontFamily = `"${customFontFace}", serif`;
      }
    }

    // 테마 변경 이벤트
    themeSelect.addEventListener('change', () => {
      customBgUrl = null;
      bgFileLabel.textContent = '🖼️ 다른 배경 이미지 직접 업로드';
      bgFileLabel.style.backgroundColor = '#f8fafc';
      bgFileLabel.style.borderColor = '#94a3b8';
      updateStyles();
    });

    // 입력 및 컨트롤 이벤트 연결
    inputTitle.addEventListener('input', updateStyles);
    inputContent.addEventListener('input', updateStyles);
    titleSize.addEventListener('input', updateStyles);
    titleColor.addEventListener('input', updateStyles);
    contentSize.addEventListener('input', updateStyles);
    contentLineHeight.addEventListener('input', updateStyles);
    contentColor.addEventListener('input', updateStyles);

    titleBtnBold.addEventListener('click', () => {
      isTitleBold = !isTitleBold;
      titleBtnBold.classList.toggle('active', isTitleBold);
      updateStyles();
    });
    titleBtnItalic.addEventListener('click', () => {
      isTitleItalic = !isTitleItalic;
      titleBtnItalic.classList.toggle('active', isTitleItalic);
      updateStyles();
    });

    ['left', 'center', 'right'].forEach(align => {
      document.getElementById(`title-align-${align}`).addEventListener('click', function() {
        titleAlign = align;
        ['left', 'center', 'right'].forEach(a => {
          document.getElementById(`title-align-${a}`).classList.remove('active');
        });
        this.classList.add('active');
        updateStyles();
      });
    });

    contentBtnBold.addEventListener('click', () => {
      isContentBold = !isContentBold;
      contentBtnBold.classList.toggle('active', isContentBold);
      updateStyles();
    });
    contentBtnItalic.addEventListener('click', () => {
      isContentItalic = !isContentItalic;
      contentBtnItalic.classList.toggle('active', isContentItalic);
      updateStyles();
    });

    ['left', 'center', 'right', 'justify'].forEach(align => {
      document.getElementById(`content-align-${align}`).addEventListener('click', function() {
        contentAlign = align;
        ['left', 'center', 'right', 'justify'].forEach(a => {
          document.getElementById(`content-align-${a}`).classList.remove('active');
        });
        this.classList.add('active');
        updateStyles();
      });
    });

    updateStyles();

    // PNG 다운로드
    btnDownload.addEventListener('click', async () => {
      try {
        const canvas = await html2canvas(handoutCard, {
          scale: 2,
          useCORS: true,
          allowTaint: true,
          backgroundColor: null
        });

        const image = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = image;
        link.download = `CoC_Handout_${Date.now()}.png`;
        link.click();
      } catch (error) {
        alert('이미지 저장 중 오류가 발생했습니다.');
        console.error(error);
      }
    });
  </script>
</body>
</html>
